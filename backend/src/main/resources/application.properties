server.port=8080

# Default H2 database configuration for local development
spring.datasource.url=jdbc:h2:mem:tickettomyshow;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Configuration for H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Production PostgreSQL configuration example
# spring.datasource.url=jdbc:postgresql://localhost:5432/tickettomyshow
# spring.datasource.username=your_pg_user
# spring.datasource.password=your_pg_password
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# spring.jpa.hibernate.ddl-auto=validate
# spring.flyway.enabled=true
# spring.flyway.locations=classpath:db/migration
# spring.flyway.baseline-on-migrate=true

# Logging
logging.level.root=INFO
logging.level.org.website=DEBUG
logging.level.org.springframework.security=DEBUG

# Jackson Configuration
spring.jackson.serialization.indent-output=true
spring.jackson.serialization.write-dates-as-timestamps=false
spring.main.banner-mode=off

# JWT Configuration
jwt.secret=your-super-secret-key-change-this-in-production-environment-here
jwt.expiration=86400000

# Razorpay Configuration (Sandbox)
razorpay.key-id=your_key_id
razorpay.key-secret=your_key_secret
razorpay.webhook.secret=your_webhook_secret

# TicketToMyShow application configuration
app.name=TicketToMyShow
app.data-loader.enabled=false
booking.expiration.check-rate-ms=60000

# Data Loader Configuration
# Set to false in production to prevent automatic data seeding
# IMPORTANT: This application is FRONTEND-DRIVEN for data population
# Use admin dashboard to create movies, theaters, and shows
# DataLoader is DISABLED by default
